<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Study</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .header {
            text-align: center;
            padding: 20px;
            background-color: #4a90e2;
            color: white;
        }
        .header h1 {
            font-size: 25px; /* Adjust this value to make it smaller */
        }       
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin: 40px auto;
            width: 80%;
        }

        .chat-container {
            width: 60%;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: white;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .sidebar {
            width: 30%;
            padding: 15px;
            border: 2px solid #ffcc00;
            background-color: #fff8e1;
            color: #333;
            font-weight: bold;
            text-align: center;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .chat-box {
            height: 400px;
            border: 2px solid #d3d3d3;
            background-color: #f4f4f4;
            padding: 15px;
            overflow-y: scroll;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .chat-input {
            width: calc(100% - 22px);
            padding: 10px;
            border: 2px solid #d3d3d3;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
        }
        .chat-button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
        }
        .chat-message {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .user, .llm {
            margin-left: 10px;
            max-width: 75%;
            word-wrap: break-word;
        }
        .user img, .llm img {
            width: 40px;
            height: 40px;
            margin-right: 10px;
            object-fit: contain; 
            border-radius: 50%; 
        }
        .user {
            color: blue;
            font-weight: bold;
        }
        .llm {
            color: green;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            background-color: #f4f4f4;
        }
        .footer img {
            height: 50px;
            margin: 0 10px;
        }
        .notice-box {
            border: 2px solid #ffcc00;
            background-color: #fff8e1;
            color: #333;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Prompt: Do you support or oppose permitting individuals with mental illnesses to purchase firearms? Please elaborate on and explain your response.</h1>
    </div>

    <div class="main-container">
        <div class="chat-container">
            <div class="chat-box" id="chat-box">
                <!-- Messages will appear here -->
            </div>
            <textarea id="chat-input" class="chat-input" placeholder="Type your Prolific ID..."></textarea>
            <button id="chat-button" class="chat-button">Send</button>
        </div>
    
        <div class="sidebar">
            <p>NOTE: Replies are very limited (between 1 - 5 responses). Please follow the system instructions and elaborate as much as possible.</p>
        </div>
    </div>
    
    <div class="footer">
        <img src="/static/StanfordDELLogoPNG.png" alt="Stanford DEL Logo">
        <img src="/static/StanfordHAILogoPNG.png" alt="Stanford HAI Logo">
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const chatInput = document.getElementById('chat-input');
        const chatButton = document.getElementById('chat-button');

        let currentStep = 'prolific-id';

        // Function to add messages to the chat box
        function addMessageToChat(role, message, className, image) {
            const chatMessage = document.createElement('div');
            chatMessage.className = 'chat-message ' + className;

            const img = document.createElement('img');
            img.src = image;
            img.alt = `${role} Icon`;

            const text = document.createElement('div');
            text.innerHTML = `<strong>${role}:</strong> ${message}`;
            text.className = className;

            chatMessage.appendChild(img);
            chatMessage.appendChild(text);

            chatBox.appendChild(chatMessage);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll
        }

        window.onload = () => {
            addMessageToChat('System', 'Before we begin, please type in your Prolific ID.', 'llm', '/static/SystemIconPNG.png');
        };


        chatButton.addEventListener('click', async () => {
            const userMessage = chatInput.value;
            if (userMessage.trim() === '') return;

            addMessageToChat('User', userMessage, 'user', '/static/FinalUserIconPNG.png');
            chatInput.value = '';

            // -------------------------
            // Handle each conversation step
            // -------------------------

            if (currentStep === 'prolific-id') {
                // 1. Send Prolific ID
                const response = await fetch('/prolific-id', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prolific_id: userMessage })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    currentStep = 'initial-argument';
                    addMessageToChat('System', result.next_prompt, 'llm', '/static/SystemIconPNG.png');
                    chatInput.placeholder = "Present a political viewpoint...";
                }

            } else if (currentStep === 'initial-argument') {
                // 2. Initial argument => possible single LLM response (grammar) or multi-round start (pragma)
                const response = await fetch('/initial-argument', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessage })
                });
                const result = await response.json();

                // If there's a message from the LLM, show it
                if (result.message) {
                    addMessageToChat('Bot-crates', result.message, 'llm', '/static/Bot-crates.png');
                }

                // If there's a system prompt, that means we are in the grammar route
                // and the server wants the final answer next.
                if (result.system_prompt) {
                    addMessageToChat('System', result.system_prompt, 'llm', '/static/SystemIconPNG.png');
                    // Now the next user submission is the final answer:
                    currentStep = 'final-answer';
                    chatInput.placeholder = "Write your final answer here...";
                } else {
                    // Otherwise, it's probably pragma-dialectical
                    // and we move on to the multi-round 'chat' step:
                    currentStep = 'chat';
                    chatInput.placeholder = "Continue the dialogue...";
                }

            } else if (currentStep === 'chat') {
                // 3. Subsequent chat turns (pragma-dialectical only)
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessage })
                });
                const result = await response.json();

                // Show the next LLM message (if any)
                if (result.message) {
                    addMessageToChat('Bot-crates', result.message, 'llm', '/static/Bot-crates.png');
                }

                // If the server sends a final system_message, study ends
                if (result.system_message) {
                    addMessageToChat('System', result.system_message, 'llm', '/static/SystemIconPNG.png');
                    chatInput.disabled = true;
                    chatButton.disabled = true;
                }

                // If there's a system_prompt from the server, it might be concluding
                if (result.system_prompt) {
                    addMessageToChat('System', result.system_prompt, 'llm', '/static/SystemIconPNG.png');
                    // Next user message is final
                    currentStep = 'final-answer';
                    chatInput.placeholder = "Write your final answer here...";
                }

            } else if (currentStep === 'final-answer') {
                // 4. Final answer step (especially for grammar expert)
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMessage })
                });
                const result = await response.json();

                if (result.system_message) {
                    addMessageToChat('System', result.system_message, 'llm', '/static/SystemIconPNG.png');
                    // End study
                    chatInput.disabled = true;
                    chatButton.disabled = true;
                }
            }
        });
    </script>
</body>
</html>
